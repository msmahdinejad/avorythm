[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lingora"
version = "0.8.1"
description = "Live and file-based multilingual translation for desktop and Chrome"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Mohammad Saleh Mahdinejad" }]
keywords = ["gemini", "live-translation", "dubbing", "accessibility", "browser-extension"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "fastapi==0.141.1",
  "google-genai==2.17.0",
  "httpx==0.28.1",
  "keyring==25.7.0",
  "numpy==2.4.6",
  "PyAudioWPatch==0.2.12.8; platform_system == 'Windows'",
  "sounddevice==0.5.5; platform_system != 'Windows'",
  "pywebview==6.2.1; platform_system != 'Linux'",
  "pywebview[qt]==6.2.1; platform_system == 'Linux'",
  "python-dotenv==1.2.2",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.2",
]
build = ["pyinstaller==6.21.0"]

[project.urls]
Homepage = "https://github.com/msmahdinejad/lingora"
Documentation = "https://github.com/msmahdinejad/lingora#readme"
Issues = "https://github.com/msmahdinejad/lingora/issues"

[project.scripts]
lingora = "lingora.__main__:main"
dubira = "dubira.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dubira", "src/lingora"]

[tool.hatch.build]
include = ["src/dubira/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["dubira", "lingora"]
