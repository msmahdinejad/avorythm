<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    @font-face{font-family:Vazirmatn;src:url('assets/vazirmatn-arabic.woff2') format('woff2');font-weight:100 900}
    @font-face{font-family:Vazirmatn;src:url('assets/vazirmatn-latin.woff2') format('woff2');font-weight:100 900}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{display:flex;align-items:center;justify-content:space-between;padding:8%;font-family:Vazirmatn,system-ui,sans-serif;color:#f7f8ff;background:radial-gradient(circle at 82% 10%,rgba(87,229,224,.14),transparent 34%),linear-gradient(135deg,#07101f,#0c1327 55%,#08272b)}
    .brand{display:flex;align-items:center;gap:30px}.brand img{width:112px;height:112px}.name{font-size:62px;line-height:1;font-weight:800}.tagline{margin-top:14px;color:#57e5e0;font-size:30px;font-weight:650}.channels{width:35%;padding:42px;border:1px solid rgba(139,92,246,.55);border-radius:28px;background:rgba(12,17,35,.62);box-shadow:inset 0 1px rgba(255,255,255,.08)}.channels p{margin:0 0 19px;color:#aab1c6;font-size:23px}.channels p:nth-child(2){color:#fff;font-weight:750}.channels p:last-child{margin-bottom:0;color:#57e5e0;font-weight:750}
    @media(max-width:600px){body{justify-content:center;padding:36px}.brand{gap:18px}.brand img{width:78px;height:78px}.name{font-size:34px}.tagline{margin-top:8px;font-size:16px}.channels{display:none}}
  </style>
</head>
<body>
  <section class="brand"><img src="assets/lingora-logo.png" alt=""><div><div class="name">Lingora</div><div id="tagline" class="tagline"></div></div></section>
  <section class="channels"><p id="original"></p><p id="dubbed"></p><p id="source"></p><p id="translated"></p></section>
  <script>
    const locale = new URLSearchParams(location.search).get('locale') === 'fa' ? 'fa' : 'en';
    const copy = {
      en:['Live translation. Your way.','Original audio','Dubbed audio','Source captions','Translated captions'],
      fa:['ترجمهٔ زنده، به انتخاب تو.','صدای اصلی','صدای دوبله','زیرنویس زبان اصلی','زیرنویس ترجمه‌شده'],
    }[locale];
    document.documentElement.lang=locale; document.documentElement.dir=locale==='fa'?'rtl':'ltr';
    ['tagline','original','dubbed','source','translated'].forEach((id,index)=>document.getElementById(id).textContent=copy[index]);
  </script>
</body>
</html>
