name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example v1.1.0)
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Linux audio runtime
        timeout-minutes: 4
        run: |
          if dpkg-query -W -f='${Status}' libportaudio2 2>/dev/null | grep -q 'install ok installed' && command -v ffmpeg >/dev/null; then
            echo 'Linux audio and media test runtimes are already available'
          else
            sudo timeout 120s apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 update
            sudo env DEBIAN_FRONTEND=noninteractive timeout 120s apt-get -o Acquire::ForceIPv4=true install -y libportaudio2 ffmpeg
          fi
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,browser]"
      - name: Install release browser
        run: python -m playwright install --with-deps chrome
      - name: Test Python and release metadata
        run: python -m pytest -q
      - name: Lint Python
        run: python -m ruff check src tests scripts/*.py
      - name: Type-check Python
        run: python -m mypy src
      - name: Validate extension JavaScript
        shell: pwsh
        run: Get-ChildItem extension -File | Where-Object Extension -in '.js','.mjs' | ForEach-Object { node --check $_.FullName }
      - name: Test extension modules
        run: node --test tests/*.test.mjs
      - name: Test real browser media pipelines
        run: xvfb-run -a python scripts/browser_smoke.py
      - name: Validate manifest
        shell: pwsh
        run: Get-Content extension/manifest.json | ConvertFrom-Json | Out-Null

  desktop:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-latest
            artifact: linux-x64
          - os: macos-latest
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate tag and package version
        shell: pwsh
        run: |
          $tagVersion = "${{ env.RELEASE_TAG }}" -replace '^v', ''
          $packageVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Release tag must be vMAJOR.MINOR.PATCH" }
          if ($tagVersion -ne $packageVersion) { throw "Tag $tagVersion does not match package $packageVersion" }
      - name: Install Linux audio runtime
        if: runner.os == 'Linux'
        timeout-minutes: 4
        shell: bash
        run: |
          if dpkg-query -W -f='${Status}' libportaudio2 2>/dev/null | grep -q 'install ok installed'; then
            echo 'libportaudio2 is already available'
          else
            sudo timeout 120s apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 update
            sudo env DEBIAN_FRONTEND=noninteractive timeout 120s apt-get -o Acquire::ForceIPv4=true install -y libportaudio2
          fi
      - name: Install Windows media tools for bundling
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-9.0.1-essentials_build.zip"
          $target = Join-Path $env:RUNNER_TEMP "ffmpeg-essentials"
          Invoke-WebRequest -UseBasicParsing `
            "https://github.com/GyanD/codexffmpeg/releases/download/9.0.1/ffmpeg-9.0.1-essentials_build.zip" `
            -OutFile $archive
          $expected = "FEC81AE03971D9DD4BE3EBE02E263BD2EC1D789483F931BDBA5F5715E65DA2E9"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if ($actual -ne $expected) { throw "FFmpeg archive checksum mismatch" }
          Expand-Archive -LiteralPath $archive -DestinationPath $target
          $binary = Get-ChildItem -LiteralPath $target -Recurse -File -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $binary) { throw "FFmpeg essentials binary was not found" }
          "AVORYTHM_FFMPEG_BINARY=$($binary.FullName)" >> $env:GITHUB_ENV
          & $binary.FullName -version | Select-Object -First 1
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,build]"
      - run: python scripts/build.py
      - shell: pwsh
        if: runner.os == 'Windows'
        run: ./scripts/package-extension.ps1
      - name: Validate extension package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "avorythm-extension-package"
          Expand-Archive -LiteralPath dist/Avorythm-Extension.zip -DestinationPath $target
          foreach ($required in @("manifest.json", "LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/OFL-Vazirmatn.txt")) {
            if (-not (Test-Path -LiteralPath (Join-Path $target $required) -PathType Leaf)) {
              throw "Extension package is missing $required"
            }
          }
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $target "manifest.json") | ConvertFrom-Json
          $tagVersion = "${{ env.RELEASE_TAG }}" -replace '^v', ''
          if ($manifest.version -ne $tagVersion) {
            throw "Extension package version $($manifest.version) does not match tag $tagVersion"
          }
          if (Test-Path -LiteralPath (Join-Path $target "icons/Avorythm.ico")) {
            throw "Windows-only ICO must not be included in the Chrome package"
          }
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Read release version
        if: runner.os == 'Windows'
        id: release-version
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Release tag must be vMAJOR.MINOR.PATCH" }
          "value=$version" >> $env:GITHUB_OUTPUT
          "file-value=$version.0" >> $env:GITHUB_OUTPUT
      - name: Upload unsigned installer for SignPath
        if: runner.os == 'Windows' && vars.SIGNPATH_ENABLED == 'true'
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v7
        with:
          name: signpath-unsigned-installer
          path: dist/Avorythm-Setup-x64.exe
          if-no-files-found: error
      - name: Submit installer to SignPath
        if: runner.os == 'Windows' && vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: dist/signpath-signed
          parameters: |
            version: ${{ toJSON(steps.release-version.outputs.value) }}
            fileVersion: ${{ toJSON(steps.release-version.outputs.file-value) }}
      - name: Stage signed installer
        if: runner.os == 'Windows' && vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path dist/signpath-signed -Recurse -File -Filter Avorythm-Setup-x64.exe | Select-Object -First 1
          if (-not $signed) { throw "SignPath did not return Avorythm-Setup-x64.exe" }
          Copy-Item -LiteralPath $signed.FullName -Destination dist/Avorythm-Setup-x64.exe -Force
          $signature = Get-AuthenticodeSignature -LiteralPath dist/Avorythm-Setup-x64.exe
          if ($signature.Status -ne 'Valid') { throw "Signed installer verification failed: $($signature.StatusMessage)" }
      - name: Mark installer as unsigned while SignPath is pending
        if: runner.os == 'Windows' && vars.SIGNPATH_ENABLED != 'true'
        shell: pwsh
        run: Move-Item -LiteralPath dist/Avorythm-Setup-x64.exe -Destination dist/Avorythm-Setup-x64-unsigned.exe
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}
          path: |
            dist/Avorythm-*.zip
            dist/Avorythm-Setup-x64*.exe
          if-no-files-found: error

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum Avorythm-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            ## Code signing policy

            SignPath Foundation review is pending. An installer ending in `-unsigned.exe` is authentic to this repository but is not code-signed yet, so Windows SmartScreen may show an unrecognized-publisher warning. After approval, releases will contain the SignPath-signed `Avorythm-Setup-x64.exe` instead.

            See the [code-signing policy](https://github.com/msmahdinejad/avorythm/blob/main/CODE_SIGNING_POLICY.md) and [privacy policy](https://github.com/msmahdinejad/avorythm/blob/main/PRIVACY.md).
          files: |
            dist/Avorythm-*.zip
            dist/Avorythm-Setup-x64*.exe
            dist/SHA256SUMS.txt
