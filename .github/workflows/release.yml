name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,build]"
      - shell: pwsh
        run: ./scripts/build.ps1
      - shell: pwsh
        run: ./scripts/package-extension.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Create checksums
        shell: pwsh
        run: |
          Get-FileHash dist/Voxilyra-Windows-x64.zip, dist/Voxilyra-Extension.zip, dist/Voxilyra-Setup-x64.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/Voxilyra-Windows-x64.zip
            dist/Voxilyra-Extension.zip
            dist/Voxilyra-Setup-x64.exe
            dist/SHA256SUMS.txt
