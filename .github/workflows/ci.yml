name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts/*.py
      - run: python -m mypy src
      - name: Validate extension JavaScript
        shell: pwsh
        run: Get-ChildItem extension -File | Where-Object Extension -in '.js','.mjs' | ForEach-Object { node --check $_.FullName }
      - name: Test standalone extension
        run: node --test tests/extension.test.mjs tests/offscreen.test.mjs
      - name: Validate manifest
        shell: pwsh
        run: Get-Content extension/manifest.json | ConvertFrom-Json | Out-Null
