<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="icons/icon32.png" type="image/png">
  <link rel="stylesheet" href="popup.css">
  <title>Avorythm</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><img src="assets/avorythm-logo.png" alt=""></span>
      <span><b>Avorythm</b><small data-i18n="tagline">Translate this tab live</small></span>
    </div>
    <div class="header-actions">
      <button id="localeToggle" class="icon-button" type="button" aria-label="Switch language">فا</button>
      <button id="settingsButton" class="icon-button settings-button" type="button" data-i18n-aria="openSettings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main>
    <section class="status-line" aria-live="polite">
      <span id="statusDot" class="status-dot"></span>
      <div><b id="statusText" data-i18n="ready">آمادهٔ ترجمه</b><small id="languageBadge">AUTO → FA</small></div>
    </section>

    <section id="setupNotice" class="setup-notice" hidden>
      <div><b data-i18n="setupNeeded">راه‌اندازی کوتاه لازم است</b><p id="setupMessage" data-i18n="setupMessage">کلید Gemini و اجازهٔ پردازش را در تنظیمات وارد کن.</p></div>
      <button id="setupButton" type="button" data-i18n="openSettings">بازکردن تنظیمات</button>
    </section>

    <section class="launch-card">
      <label class="language-field" for="targetLanguage">
        <span data-i18n="language">زبان مقصد</span>
        <select id="targetLanguage"></select>
      </label>

      <fieldset class="mode-picker">
        <legend data-i18n="playbackMode">روش پخش</legend>
        <label class="mode-option">
          <input type="radio" name="playbackMode" value="low-latency">
          <span><b data-i18n="lowLatency">داخل همین صفحه</b><small data-i18n="lowLatencyHelp">سریع‌ترین حالت برای صدا و زیرنویس زنده</small></span>
        </label>
        <label class="mode-option featured">
          <input type="radio" name="playbackMode" value="synchronized">
          <span><b data-i18n="synchronized">ضبط و پلیر هماهنگ</b><small data-i18n="synchronizedHelp">ضبط جلوتر ادامه دارد؛ پلیر مستقل Seek و Fullscreen دارد</small></span>
          <em data-i18n="bestSync">سینک پایدار</em>
        </label>
      </fieldset>

      <button id="toggleButton" class="primary-button" type="button" disabled>
        <span class="action-icon">▶</span>
        <span><b data-i18n="start">شروع ترجمه</b><small id="actionHint" data-i18n="startHint">صدای همین تب ترجمه می‌شود</small></span>
      </button>
    </section>

    <section class="output-summary">
      <div class="section-title"><span><b data-i18n="yourOutput">خروجی انتخاب‌شده</b><small id="outputCount"></small></span><button id="editOutputButton" type="button" data-i18n="edit">ویرایش</button></div>
      <div id="outputChips" class="output-chips" aria-live="polite"></div>
    </section>

    <div id="downloadReady" class="success-message" hidden data-i18n="downloadReady">چهار فایل در Downloads ذخیره شدند.</div>
    <div id="errorMessage" class="error-message" role="alert" hidden></div>
  </main>

  <footer>
    <span data-i18n="privacy">صدا فقط پس از شروع به Google Gemini فرستاده می‌شود.</span>
    <div><a id="helpLink" href="https://github.com/msmahdinejad/avorythm/blob/main/docs/HELP.md" target="_blank" rel="noreferrer" data-i18n="help">راهنما ↗</a><a href="https://github.com/msmahdinejad/avorythm" target="_blank" rel="noreferrer" data-i18n="project">پروژه ↗</a></div>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
